# Publishes @aeolus-fleet/common, server and web to npm with one version, and
# tags the released commit v<version>, so a version on npm always matches a tag
# in git.
#
# The only way the packages can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (ADR 0011).
# Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for all three packages, MAJOR.MINOR.PATCH (the first real release is 0.1.0)
        required: true
        type: string

permissions:
  id-token: write
  # To push the release tag.
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      - name: Set the version on all three packages
        env:
          VERSION: ${{ inputs.version }}
        run: npm run set-version -- "$VERSION"

      - run: npm run build

      # Catch a problem in any package before the first one is published.
      - name: Dry run all three
        run: |
          npm publish --dry-run --access public --workspace @aeolus-fleet/common
          npm publish --dry-run --access public --workspace @aeolus-fleet/server
          npm publish --dry-run --access public --workspace @aeolus-fleet/web

      - name: Publish @aeolus-fleet/common
        run: npm publish --access public --workspace @aeolus-fleet/common
      - name: Publish @aeolus-fleet/server
        run: npm publish --access public --workspace @aeolus-fleet/server
      - name: Publish @aeolus-fleet/web
        run: npm publish --access public --workspace @aeolus-fleet/web

      # After all three are on npm. If this step fails, push the tag by hand:
      # the version is already published and cannot be released again.
      - name: Tag the released commit v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
