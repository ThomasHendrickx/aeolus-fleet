# Publishes @aeolus-fleet/common, core, console, squadrons, trierarch-plugin and trierarch to npm with one version, and
# tags the released commit v<version>, so a version on npm always matches a tag
# in git. Then creates the GitHub Release for the tag, with notes from the merged
# pull requests carrying the label <version>, and sets the aeolus Claude Code
# plugin to that version on main, where the plugin marketplace installs from.
#
# The only way the packages can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (ADR 0011).
# Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for all six packages, MAJOR.MINOR.PATCH
        required: true
        type: string

permissions:
  id-token: write
  # To push the release tag, create its GitHub Release, and push the plugin's version to main.
  contents: write
  # To read the merged pull requests carrying the release's label, for its notes.
  pull-requests: read
  # To read CI's result for the released commit.
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      # No second test run (ADR 0011): CI's own result for this exact commit on
      # main is the gate, read before anything is built or published.
      - name: Check the commit is on main and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch main --event push --json status,conclusion,url \
            | node scripts/release-gate.ts "$GITHUB_REF" "$GITHUB_SHA"

      - name: Set the version on all six packages
        env:
          VERSION: ${{ inputs.version }}
        run: npm run set-version -- "$VERSION"

      - run: npm run build

      # Catch a problem in any package before the first one is published. A dry
      # run refuses a version on npm already too, so it skips those, as the
      # publish steps below do.
      - name: Dry run all six
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for PACKAGE in @aeolus-fleet/common @aeolus-fleet/core @aeolus-fleet/console @aeolus-fleet/squadrons @aeolus-fleet/trierarch-plugin @aeolus-fleet/trierarch; do
            if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
              echo "$PACKAGE@$VERSION is on npm already: skipped"
            else
              npm publish --dry-run --access public --workspace "$PACKAGE"
            fi
          done

      # Each step skips a package whose version is on npm already, so releasing a
      # version again after it failed partway publishes only what is missing, then
      # tags and sets the plugin. Dispatch it again from main: Re-run jobs replays
      # the failed run's own copy of this file.
      - name: Publish @aeolus-fleet/common
        env:
          PACKAGE: '@aeolus-fleet/common'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi
      - name: Publish @aeolus-fleet/core
        env:
          PACKAGE: '@aeolus-fleet/core'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi
      - name: Publish @aeolus-fleet/console
        env:
          PACKAGE: '@aeolus-fleet/console'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi
      # Last: squadrons is optional, so a problem here leaves the fleet's three published.
      - name: Publish @aeolus-fleet/squadrons
        env:
          PACKAGE: '@aeolus-fleet/squadrons'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi

      # Last too: the trierarch plugin is optional, like squadrons.
      - name: Publish @aeolus-fleet/trierarch-plugin
        env:
          PACKAGE: '@aeolus-fleet/trierarch-plugin'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi

      # Last too: the trierarch is optional, like squadrons.
      - name: Publish @aeolus-fleet/trierarch
        env:
          PACKAGE: '@aeolus-fleet/trierarch'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public --workspace "$PACKAGE"
          fi

      # After all six are on npm. If this step fails, push the tag by hand:
      # the version is already published and cannot be released again.
      - name: Tag the released commit v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # Notes from the merged pull requests labelled with the version: git and the
      # labels are the source, there is no changelog file. Skipped when the
      # Release exists already, as when a release is dispatched again.
      - name: Create the GitHub Release v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION exists already"
            exit 0
          fi
          gh pr list --state merged --label "$VERSION" --json number,title,url --limit 1000 \
            | node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

      # The plugin marketplace installs from main, so main carries the plugin's
      # released version (the packages on main keep 0.0.0). After the tag: if
      # this step fails, the release is whole; set it by hand with
      # npm run set-version -- --plugin-only <version>, commit and push.
      - name: Set the aeolus plugin to ${{ inputs.version }} on main
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git checkout --quiet --force -B plugin-version origin/main
            npm run set-version -- --plugin-only "$VERSION"
            if git diff --quiet; then
              echo "main already carries the aeolus plugin at $VERSION"
              exit 0
            fi
            git commit --quiet --all --message "chore(release): the aeolus plugin is $VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "main moved meanwhile (attempt $attempt); trying again on top of it"
          done
          echo "::error::Could not push the aeolus plugin version to main"
          exit 1
