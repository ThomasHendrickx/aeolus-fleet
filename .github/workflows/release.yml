# Publishes core's release train (decision 0049), @aeolus-fleet/common, ui, core
# and console, to npm with one version and tags v<version> the released commit, so a
# version on npm always matches a tag in git. It publishes the tarballs a run of
# candidate.yml packed, the ones staging walked, and builds nothing itself. Then
# creates the GitHub Release for the tag, with notes from the merged pull
# requests carrying the label <version>.
#
# The only way the packages can be published: npm trusted publishing (OIDC) is
# configured for exactly this file name, and tokens are disallowed (ADR 0011).
# Never add an NPM_TOKEN or any other npm secret. Provenance is automatic.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version for common, ui, core and console, MAJOR.MINOR.PATCH
        required: true
        type: string
      candidate_run_id:
        description: The run of candidate.yml whose tarballs are published, packed from this commit at this version
        required: true
        type: string
      override_reason:
        description: Only Thomas, to release without a passed staging walk; the reason goes into the log and the Release notes
        required: false
        type: string
        default: ''

permissions:
  id-token: write
  # To push the release tag and create its GitHub Release.
  contents: write
  # To read the merged pull requests carrying the release's label, for its notes.
  pull-requests: read
  # To read CI's result for the released commit, and download the candidate's tarballs.
  actions: read
  # To read the staging-walk status the walker set on the released commit.
  statuses: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  release:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Plain releases only: npm needs a dist-tag for a prerelease, which this workflow does not set.
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH, got '$VERSION'"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Check the version is not tagged yet
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # --exit-code: 0 when the tag exists, 2 when it does not, anything else is an error.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || status=$?
          if [[ $status -eq 0 ]]; then
            echo "::error::Tag v$VERSION already exists: that version was released before"
            exit 1
          elif [[ $status -ne 2 ]]; then
            echo "::error::Could not read the tags from origin (git ls-remote exited $status)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Use npm 11.5.1 or later (needed for trusted publishing)
        run: |
          if ! node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            process.exit(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))) ? 0 : 1);
          ' "$(npm --version)"; then
            npm install --global npm@^11.5.1
          fi
          npm --version

      - run: npm ci

      # No second test run (ADR 0011): CI's own result for this exact commit on
      # the release branch is the gate, read before anything is built or published.
      - name: Check the commit is on a release branch and passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run list --workflow ci.yml --commit "$GITHUB_SHA" --branch "$GITHUB_REF_NAME" --event push --json status,conclusion,url \
            | node scripts/release-gate.ts "$GITHUB_REF" "$GITHUB_SHA"

      # The walker's staging-walk status on this commit, or Thomas's reason to release without it.
      - name: Check the staging walk passed on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/statuses" \
            | node scripts/staging-walk-gate.ts "$GITHUB_SHA" "$GITHUB_REPOSITORY_OWNER" "$GITHUB_ACTOR" "$OVERRIDE_REASON"

      - name: Download the candidate's tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          name=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[0].name')
          gh run download "$RUN_ID" --name "$name" --dir "$RUNNER_TEMP/candidate"
          ls -l "$RUNNER_TEMP/candidate"

      - name: Check the candidate is this commit at this version, byte for byte
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          gh run view "$RUN_ID" --json workflowName,conclusion,headSha \
            | node scripts/candidate-check.ts "$VERSION" "$GITHUB_SHA" "$RUNNER_TEMP/candidate"

      # Catch a problem in any tarball before the first one is published. A dry
      # run refuses a version on npm already too, so it skips those, as the
      # publish steps below do.
      - name: Dry run all four
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for NAME in common ui core console; do
            if [[ "$(npm view "@aeolus-fleet/$NAME@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
              echo "@aeolus-fleet/$NAME@$VERSION is on npm already: skipped"
            else
              npm publish --dry-run --access public "$RUNNER_TEMP/candidate/aeolus-fleet-$NAME-$VERSION.tgz"
            fi
          done

      # Each step skips a package whose version is on npm already, so releasing a
      # version again after it failed partway publishes only what is missing, then
      # tags. Dispatch it again from its release branch: Re-run jobs replays the failed run's own
      # copy of this file.
      - name: Publish @aeolus-fleet/common
        env:
          PACKAGE: '@aeolus-fleet/common'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public "$RUNNER_TEMP/candidate/aeolus-fleet-common-$VERSION.tgz"
          fi
      - name: Publish @aeolus-fleet/ui
        env:
          PACKAGE: '@aeolus-fleet/ui'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public "$RUNNER_TEMP/candidate/aeolus-fleet-ui-$VERSION.tgz"
          fi
      - name: Publish @aeolus-fleet/core
        env:
          PACKAGE: '@aeolus-fleet/core'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public "$RUNNER_TEMP/candidate/aeolus-fleet-core-$VERSION.tgz"
          fi
      - name: Publish @aeolus-fleet/console
        env:
          PACKAGE: '@aeolus-fleet/console'
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$(npm view "$PACKAGE@$VERSION" version 2>/dev/null)" == "$VERSION" ]]; then
            echo "$PACKAGE@$VERSION is on npm already: skipped"
          else
            npm publish --access public "$RUNNER_TEMP/candidate/aeolus-fleet-console-$VERSION.tgz"
          fi
      # After all four are on npm. If this step fails, push the tag by hand: the
      # version is already published and cannot be released again.
      - name: Tag v${{ inputs.version }}, the released commit
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

      # Notes from the merged pull requests labelled with the version: git and the
      # labels are the source, there is no changelog file. Skipped when the
      # Release exists already, as when a release is dispatched again.
      - name: Create the GitHub Release v${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
          OVERRIDE_REASON: ${{ inputs.override_reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "The GitHub Release v$VERSION exists already"
            exit 0
          fi
          gh pr list --state merged --label "$VERSION" --json number,title,url --limit 1000 \
            | node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          if [[ -n "${OVERRIDE_REASON// /}" ]]; then
            printf '\n**Released without a passed staging walk**, by %s: %s\n' "$GITHUB_ACTOR" "$OVERRIDE_REASON" >> "$RUNNER_TEMP/release-notes.md"
          fi
          gh release create "v$VERSION" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
