name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: Integration tests (Postgres in Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  publish-dry-run:
    name: Publish dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # The same steps as release.yml, with a throwaway prerelease version:
      # 0.0.0 is already on npm, and npm requires a tag for a prerelease.
      - run: npm run set-version -- "0.0.0-ci.${{ github.run_id }}"
      - run: npm run build
      - run: npm publish --dry-run --access public --tag dry-run --workspace @aeolus-fleet/common
      - run: npm publish --dry-run --access public --tag dry-run --workspace @aeolus-fleet/server
      - run: npm publish --dry-run --access public --tag dry-run --workspace @aeolus-fleet/web
