name: Owners lock evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  owners-lock:
    if: github.head_ref == 'fix/core-2005-owners-concurrency'
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/test-images
      - name: The held owner changes serialize with the ownership lock
        run: npm run test:integration -- owners.integration.test.ts -t 'serializes opposite owner edges so only one commits' --reporter=verbose
      - name: Removing the ownership lock makes the named test fail with a deadlock
        shell: bash
        run: |
          trap 'git restore packages/core/src/domain/registry/set-owner.ts' EXIT
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'packages/core/src/domain/registry/set-owner.ts';
          const source = readFileSync(path, 'utf8');
          const lock = '      await tx.ships.lockOwnership(fleetId);\n';
          if (source.split(lock).length !== 2) throw new Error('Expected exactly one ownership lock call');
          writeFileSync(path, source.replace(lock, ''));
          NODE
          set +e
          npm run test:integration -- owners.integration.test.ts -t 'serializes opposite owner edges so only one commits' --reporter=verbose --reporter=json --outputFile.json=/tmp/owners-lock-mutation.json > /tmp/owners-lock-mutation.log 2>&1
          mutation_status=$?
          set -e
          cat /tmp/owners-lock-mutation.log
          test "$mutation_status" -ne 0
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/owners-lock-mutation.json', 'utf8'));
          const tests = report.testResults.flatMap((file) => file.assertionResults);
          const named = tests.find((test) => test.title === 'serializes opposite owner edges so only one commits');
          if (named?.status !== 'failed') throw new Error('The named owners concurrency test must fail');
          if (!/deadlock/i.test(named.failureMessages.join('\n'))) throw new Error('The failure must identify the deadlock');
          console.log('Verified: the named owners concurrency test fails with a deadlock when the ownership lock is removed.');
          NODE
      - name: The ownership lock is restored
        if: always()
        run: git diff --exit-code -- packages/core/src/domain/registry/set-owner.ts
      - name: Save lock-removal evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: owners-lock-mutation-evidence
          path: /tmp/owners-lock-mutation.*
