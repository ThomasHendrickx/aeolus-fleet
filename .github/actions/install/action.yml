# Puts node_modules (the root's and every workspace's) on the runner from the
# Actions cache, and runs npm ci only on a miss (#2013). The cache is saved when the
# job succeeds after a miss. The key holds the runner OS, the exact Node version and
# the package-lock.json hash. The Prisma client is generated by npm ci's postinstall
# on a miss; on a hit this action generates it, as postinstall would. Needs the
# repository checked out and Node set up.
name: Install
description: Restores node_modules from the Actions cache, or runs npm ci on a miss.
runs:
  using: composite
  steps:
    - id: node
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"
    - id: modules
      uses: actions/cache@v6
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}
    - name: Install, on a cache miss
      if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
    - name: Generate the Prisma client, on a cache hit
      if: steps.modules.outputs.cache-hit == 'true'
      shell: bash
      run: npm run generate --workspace @aeolus-fleet/core
