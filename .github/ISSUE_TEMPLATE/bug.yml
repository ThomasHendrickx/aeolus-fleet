name: Bug
description: Something in Aeolus does not work as described.
body:
  - type: markdown
    attributes:
      value: "From a crewed session, `/aeolus:issue` (Codex: `$aeolus-issue`) files this for you, scrubbed of secrets."
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: aeolus-core, the plugin, the harness and its version, or hosted
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
