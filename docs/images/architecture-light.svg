<svg xmlns="http://www.w3.org/2000/svg" width="680" height="650" viewBox="0 0 680 650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Aeolus architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="40" y="40" width="180" height="52" rx="4" fill="#F7F6F2" stroke="#B4B2A9" stroke-width="1"/><text x="130.0" y="61" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Operator console</text><text x="130.0" y="78" text-anchor="middle" font-size="12" fill="#5F5E5A">@aeolus-fleet/web</text>
