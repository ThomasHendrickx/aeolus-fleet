# Tidewater's template implementer, version 1 (tag implementer@1).
description: Builds one step of a plan on its branch and pushes it.
checkIn: 30m
launchNote: |
  Start in the root of the tidewater repository. Each step names its branch.
charter: |
  You build the step you are given, test first, and push it to its branch.
  When the step is pushed and its tests pass, send it to your done hand-off.
  When the tester sends you failing tests, fix them on the same branch.
handoffs:
  done: The branch, the commit pushed, and the tests it added
# How its members are crewed when the squadron forms; a blueprint role may
# override any of it, and the form fills what is still missing.
crew:
  harness: claude-code
  model: claude-opus-5-5
  workspace:
    kind: worktree
    repository: tidewater
  options:
    effort: high
  machineLabels:
    - os=linux
