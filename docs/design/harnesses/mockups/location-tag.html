<div class="doc"><header><h1>LocationTag: Copilot and Cursor by name and icon (S6, S11)</h1><p class="lede">Today any harness the console does not know shows as plain text. S6 names Copilot, S11 Cursor, each with the terminal icon of a coding agent.</p>
<div class="theme"><button data-theme="light" aria-pressed="true" onclick="setTheme('light')">Light</button><button data-theme="dark" aria-pressed="false" onclick="setTheme('dark')">Dark</button><span class="key"><i></i>what changed</span></div></header>
<div id="scenes" class="col" style="gap:40px"></div></div>
<script>const PATHS = {
  terminal: '<path d="m7 11 2-2-2-2"/><path d="M11 13h4"/><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>',
  copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  alert: '<circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/>',
  retry: '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  laptop: '<path d="M18 5a2 2 0 0 1 2 2v8.526a2 2 0 0 0 .212.897l1.068 2.127a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45l1.068-2.127A2 2 0 0 0 4 15.526V7a2 2 0 0 1 2-2z"/><path d="M20.054 15.987H3.946"/>',
  cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  server: '<rect width="20" height="8" x="2" y="2" rx="2" ry="2"/><rect width="20" height="8" x="2" y="14" rx="2" ry="2"/><line x1="6" x2="6.01" y1="6" y2="6"/><line x1="6" x2="6.01" y1="18" y2="18"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  window: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M10 4v4"/><path d="M2 8h20"/><path d="M6 4v4"/>',
  bot: '<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
  usercheck: '<path d="m16 11 2 2 4-4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>',
  ship: '<path d="M12 10.189V14"/><path d="M12 2v3"/><path d="M19 13V7a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v6"/><path d="M19.38 20A11.6 11.6 0 0 0 21 14l-8.188-3.639a2 2 0 0 0-1.624 0L3 14a11.6 11.6 0 0 0 2.81 7.76"/><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1s1.2 1 2.5 1c2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
};
const ic = (name, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${PATHS[name]}</svg>`;
/** Wraps html in the change box when a label is given. */
const chg = (html, label) => (label ? `<div class="chg" data-chg="${label}">${html}</div>` : html);
const chgIn = (html, label) => (label ? `<span class="chg" data-chg="${label}">${html}</span>` : html);
function setTheme(theme) {
  document.documentElement.classList.toggle('dark', theme === 'dark');
  document.querySelectorAll('.theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === theme)));
}
function state(tag, isAfter, text, frames) {
  return `<div class="state"><div class="label"><b class="${isAfter ? 'after' : ''}">${tag}</b><span>${text}</span></div><div class="frames">${frames}</div></div>`;
}
const KIND = { DEVICE: ['laptop', 'Device'], CLOUD: ['cloud', 'Cloud'], SERVER: ['server', 'Server'], OTHER: ['pin', 'Other'] };
/** The harnesses the console names in each phase; any other shows as stated, with no icon. */
const KNOWN = {
  before: { 'claude-code': ['Claude Code', 'terminal'], codex: ['Codex', 'terminal'], console: ['Console', 'window'] },
};
KNOWN.s6 = { ...KNOWN.before, copilot: ['Copilot', 'terminal'] };
KNOWN.s11 = { ...KNOWN.s6, cursor: ['Cursor', 'terminal'] };
const markFor = (phase, harness) =>
  (phase === 's6' && harness === 'copilot') || (phase === 's11' && harness === 'cursor') ? (phase === 's6' ? 'S6' : 'S11') : null;

function tag(phase, harness, kind, size = 'sm', mark = true) {
  const known = KNOWN[phase][harness];
  const [kIcon, kWord] = KIND[kind];
  const html = `<span class="loc ${size}" title="${known ? known[0] : harness} · ${kWord}">${known ? ic(known[1]) : ''}<span class="n trunc">${known ? known[0] : harness}</span><span aria-hidden="true">·</span>${ic(kIcon)}<span class="trunc">${kWord}</span></span>`;
  return mark ? chgIn(html, markFor(phase, harness)) : html;
}

const SHIPS = [
  { name: 'argo', harness: 'console', kind: 'DEVICE', report: 'Reviewing the harness mockups', seen: 'Just now' },
  { name: 'reviewer-01', harness: 'claude-code', kind: 'DEVICE', model: 'claude-opus-5-5', report: 'Reviewing PR 1388', seen: '2 min ago' },
  { name: 'builder-02', harness: 'codex', kind: 'CLOUD', model: 'gpt-5.5-codex', report: 'Running the slice tests', seen: '5 min ago' },
  { name: 'docs-03', harness: 'copilot', kind: 'DEVICE', model: 'gpt-5.2', report: 'Writing the Copilot guide', seen: '1 min ago' },
  { name: 'ui-04', harness: 'cursor', kind: 'DEVICE', model: 'auto', report: 'Idle', seen: '8 min ago' },
];
const badge = `<span class="badge ok">${ic('usercheck', 'sm')}Crewed</span>`;
const runsOn = (phase, s) => `<span class="row g3">${tag(phase, s.harness, s.kind)}${s.model ? `<span class="mono mute trunc">${s.model}</span>` : ''}</span>`;

function table(phase) {
  const rows = SHIPS.map((s) => `<tr><td class="w5">${s.name}</td><td>${badge}</td><td class="trunc" style="max-width:220px">${s.report}</td><td></td><td>${runsOn(phase, s)}</td><td class="mute meta">${s.seen}</td></tr>`).join('');
  return `<table class="tbl"><thead><tr><th>Ship</th><th>Status</th><th>Report</th><th>Squadron and labels</th><th>Runs on</th><th>Seen</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function list(phase) {
  return SHIPS.map((s) => `<div class="prow"><div class="row"><span class="w5" style="font-size:var(--text-body-touch)">${s.name}</span><span class="end">${badge}</span></div><div class="row wrap g3">${runsOn(phase, s)}</div><div class="meta trunc">${s.report} · ${s.seen}</div></div>`).join('');
}
const chrome = (inner) => `<div class="desk"><div class="dhdr"><span class="w6">Fleet</span><span class="meta">5 ships</span></div><div class="dpage">${inner}</div></div>`;
const phoneChrome = (inner) => `<div class="phone"><div class="phdr w6">Fleet</div><div class="col">${inner}</div></div>`;
const pair = (phase) => chrome(table(phase)) + phoneChrome(list(phase));

function variants(phase) {
  const cells = ['copilot', 'cursor']
    .map((h) => chg(`<div class="col g2"><span class="cap mute">harness: ${h}</span>${Object.keys(KIND).map((k) => `<div class="row g3">${tag(phase, h, k, 'md', false)}<span class="end">${tag(phase, h, k, 'sm', false)}</span></div>`).join('')}</div>`, markFor(phase, h)))
    .join('');
  return `<div class="card" style="width:760px"><div class="vgrid">${cells}</div><p class="cap mute" style="margin-top:12px">Left md (ship page), right sm (Runs on). No vendor logos: the terminal icon of a coding agent.</p></div>`;
}

function elsewhere(phase) {
  const word = (h) => (KNOWN[phase][h] ? KNOWN[phase][h][0] : h);
  const markFor = (p) => (p === 'before' ? null : 'S6, S11');
  const header = `<div class="card col g2" style="width:420px"><span class="cap mute">Ship page header, docs-03</span><span style="font-size:var(--text-title);line-height:var(--text-title--line-height)" class="w6">docs-03</span>
    <span class="row wrap g3"><span class="loc md">${ic('laptop')}<span>Device · <span class="n">thomas-mbp</span></span></span>
    ${chgIn(`<span class="meta">${word('copilot')} · <span class="mono">gpt-5.2</span></span>`, markFor(phase))}</span></div>`;
  const card = `<div class="card col g2" style="width:420px"><span class="cap mute">Machine card, harnesses its trierarch offers</span>
    <span class="row g15 w5">${ic('bot', 'sm mute')}Claude Code <span class="meta" style="font-weight:400">2.1.293 · models confirmed 3 h ago</span></span>
    <span class="row g15 w5">${ic('bot', 'sm mute')}${chgIn(word('copilot'), markFor(phase))} <span class="meta" style="font-weight:400">1.0.105 · models confirmed 3 h ago</span></span>
    <span class="row g15 w5">${ic('bot', 'sm mute')}${chgIn(word('cursor'), markFor(phase))} <span class="meta" style="font-weight:400">2026.10.22 · models confirmed 1 h ago</span></span></div>`;
  return header + card;
}

function tableState(st) {
  if (st === 'loading') {
    const sk = (n) => Array.from({ length: n }, () => `<div class="sk" style="height:40px"></div>`).join('');
    return chrome(`<div class="col g2">${sk(6)}</div>`) + phoneChrome(`<div class="col g2" style="padding:12px">${sk(5)}</div>`);
  }
  if (st === 'error') {
    const e = `<div class="err">${ic('alert')}<div><b>Couldn’t load the fleet</b><p>This page couldn’t reach the fleet server. Check that the server is running and reachable from this browser, then try again.</p><button class="btn" style="margin-top:10px">${ic('retry', 'sm')}Try again</button></div></div>`;
    return chrome(e) + phoneChrome(`<div style="padding:12px">${e}</div>`);
  }
  const argo = SHIPS.slice(0, 1);
  const empty = `<div class="empty">${ic('ship', 'xl mute')}<b>No ships besides argo yet</b><p class="meta">argo is your own ship: messages to the operator land in its inbox. Commission a ship to add an agent to the fleet.</p><button class="btn primary">Commission your first ship</button></div>`;
  const t = `<table class="tbl"><thead><tr><th>Ship</th><th>Status</th><th>Report</th><th>Squadron and labels</th><th>Runs on</th><th>Seen</th></tr></thead><tbody>${argo.map((s) => `<tr><td class="w5">${s.name}</td><td>${badge}</td><td>${s.report}</td><td></td><td>${runsOn('before', s)}</td><td class="mute meta">${s.seen}</td></tr>`).join('')}</tbody></table>`;
  return chrome(t + empty) + phoneChrome(`<div class="prow"><div class="row"><span class="w5">argo</span><span class="end">${badge}</span></div><div>${runsOn('before', argo[0])}</div></div>${empty}`);
}

document.getElementById('scenes').innerHTML = [
  `<section class="scene"><h2>Fleet overview, Runs on</h2><p>A trierarch already crews Copilot and Cursor sessions; the console shows their harness as stated.</p>
    ${state('Before', false, 'copilot and cursor as plain text, no icon.', pair('before'))}
    ${state('After S6', true, 'Copilot by name, with the terminal icon.', pair('s6'))}
    ${state('After S11', true, 'Cursor too.', pair('s11'))}</section>`,
  `<section class="scene"><h2>Kinds and sizes</h2>
    ${state('Before', false, '', variants('before'))}
    ${state('After S6', true, '', variants('s6'))}
    ${state('After S11', true, '', variants('s11'))}</section>`,
  `<section class="scene"><h2>The same name elsewhere</h2><p>The harness name comes from one list, so these follow.</p>
    ${state('Before', false, '', elsewhere('before'))}
    ${state('After S11', true, '', elsewhere('s11'))}</section>`,
  `<section class="scene"><h2>Fleet overview states</h2><p>Unchanged in S6 and S11: a LocationTag shows only on a crewed ship's row.</p>
    ${state('Loading', false, '', tableState('loading'))}
    ${state('Error', false, '', tableState('error'))}
    ${state('Empty', false, 'Only argo.', tableState('empty'))}</section>`,
].join('');
</script></body></html>
