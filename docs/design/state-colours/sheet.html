<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ship state colours: today and proposed (#1618)</title>
<!--
  Stands alone. Today's tone tokens are packages/ui/src/tokens.css; the proposed ones are state-colours.md, section 3.
  .today and .proposed each set the --tone-* families, light on the theme and dark under .dark.
  The contrast table is measured in the page: every colour is drawn on a canvas and read back as sRGB.
  Geist if installed, else the system sans.
-->
<style>
:root {
  --background:oklch(0.99 0.002 247); --card:oklch(1 0 0); --muted:oklch(0.967 0.005 247); --secondary:oklch(0.955 0.007 247);
  --foreground:oklch(0.22 0.02 257); --muted-foreground:oklch(0.5 0.02 257); --border:oklch(0.912 0.008 247);
  --primary:#1A3860; --page:#e6e9ee;
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
.dark {
  color-scheme: dark;
  --background:oklch(0.172 0.012 257); --card:oklch(0.2 0.013 257); --muted:oklch(0.228 0.012 257); --secondary:oklch(0.255 0.013 257);
  --foreground:oklch(0.955 0.005 247); --muted-foreground:oklch(0.72 0.016 257); --border:oklch(0.29 0.014 257);
  --primary:#B6D5F4; --page:#0b0e13;
}
/* Today: tokens.css as it is. */
.today, .legend .today {
  --tone-waiting-bg:oklch(0.965 0.045 85); --tone-waiting-fg:oklch(0.47 0.1 62); --tone-waiting-border:oklch(0.87 0.08 80);
  --tone-active-bg:oklch(0.955 0.03 250); --tone-active-fg:oklch(0.45 0.14 257); --tone-active-border:oklch(0.86 0.06 252);
  --tone-ok-bg:oklch(0.96 0.04 155); --tone-ok-fg:oklch(0.44 0.1 155); --tone-ok-border:oklch(0.86 0.07 155);
  --tone-attention-bg:oklch(0.957 0.028 25); --tone-attention-fg:oklch(0.5 0.19 27); --tone-attention-border:oklch(0.86 0.07 25);
  --tone-ended-bg:oklch(0.957 0.005 247); --tone-ended-fg:oklch(0.47 0.015 257); --tone-ended-border:oklch(0.87 0.01 247);
  --band:oklch(0.62 0.15 155);
}
.dark .today {
  --tone-waiting-bg:oklch(0.29 0.055 72); --tone-waiting-fg:oklch(0.87 0.11 82); --tone-waiting-border:oklch(0.41 0.075 72);
  --tone-active-bg:oklch(0.29 0.06 257); --tone-active-fg:oklch(0.85 0.08 252); --tone-active-border:oklch(0.42 0.09 257);
  --tone-ok-bg:oklch(0.29 0.05 155); --tone-ok-fg:oklch(0.86 0.1 155); --tone-ok-border:oklch(0.41 0.07 155);
  --tone-attention-bg:oklch(0.3 0.07 25); --tone-attention-fg:oklch(0.84 0.09 25); --tone-attention-border:oklch(0.45 0.11 25);
  --tone-ended-bg:oklch(0.255 0.01 257); --tone-ended-fg:oklch(0.78 0.015 257); --tone-ended-border:oklch(0.36 0.012 257);
  --band:oklch(0.75 0.13 155);
}
/* Proposed: attention from Coral, waiting from Amber, active from Sea, blocked violet (new); ok and ended as today. */
.proposed {
  --tone-attention-bg:#FFEEE9; --tone-attention-fg:#AE3820; --tone-attention-border:#FFC2B2;
  --tone-waiting-bg:#FDF4E1; --tone-waiting-fg:#8A5300; --tone-waiting-border:#F0D198;
  --tone-active-bg:#E8F6FB; --tone-active-fg:#0B6A88; --tone-active-border:#A6DAEB;
  --tone-blocked-bg:#F3EEFC; --tone-blocked-fg:#6B3FB8; --tone-blocked-border:#D3C3F2;
  --tone-ok-bg:oklch(0.96 0.04 155); --tone-ok-fg:oklch(0.44 0.1 155); --tone-ok-border:oklch(0.86 0.07 155);
  --tone-ended-bg:oklch(0.957 0.005 247); --tone-ended-fg:oklch(0.47 0.015 257); --tone-ended-border:oklch(0.87 0.01 247);
  --band:#2BA3C9;
}
.dark .proposed {
  --tone-attention-bg:#3A1E19; --tone-attention-fg:#FFA58F; --tone-attention-border:#7B3628;
  --tone-waiting-bg:#33280F; --tone-waiting-fg:#F3C46C; --tone-waiting-border:#6E5119;
  --tone-active-bg:#0E2C37; --tone-active-fg:#85D3EC; --tone-active-border:#1F5E72;
  --tone-blocked-bg:#2A2142; --tone-blocked-fg:#C9B1F7; --tone-blocked-border:#523E86;
  --tone-ok-bg:oklch(0.29 0.05 155); --tone-ok-fg:oklch(0.86 0.1 155); --tone-ok-border:oklch(0.41 0.07 155);
  --tone-ended-bg:oklch(0.255 0.01 257); --tone-ended-fg:oklch(0.78 0.015 257); --tone-ended-border:oklch(0.36 0.012 257);
  --band:#2BA3C9;
}
* { box-sizing: border-box; }
body { margin: 0; background: #d9dde4; }
.theme { background: var(--page); color: var(--foreground); padding: 28px 32px 36px; }
h1 { font-size: 22px; margin: 0 0 6px; }
h2 { font-size: 16px; margin: 30px 0 10px; }
h3 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
p.note { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted-foreground); max-width: 1100px; }
code { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
.mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; }
table.t { border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.t th, .t td { text-align: left; vertical-align: middle; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.t th { font-size: 12px; font-weight: 600; color: var(--muted-foreground); background: var(--muted); }
.place { display: grid; grid-template-columns: 230px 1fr 1fr; gap: 16px; padding: 18px 0; border-top: 1px solid var(--border); align-items: start; }
.place > .label { font-size: 14px; font-weight: 600; }
.place > .label small { display: block; font-weight: 400; font-size: 12px; color: var(--muted-foreground); margin-top: 4px; line-height: 1.45; }
.col { background: var(--background); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
.col > .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted-foreground); margin-bottom: 10px; }
.heads { display: grid; grid-template-columns: 230px 1fr 1fr; gap: 16px; margin-top: 18px; font-size: 13px; font-weight: 600; color: var(--muted-foreground); }
svg.i { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.st { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; padding: 1px 8px; border-radius: 9999px; border: 1px solid; font-size: 12px; }
.muted { color: var(--muted-foreground); }
/* Fleet table */
.ft { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; }
.ft th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted-foreground); padding: 7px 10px; border-bottom: 1px solid var(--border); }
.ft td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.ft tr:last-child td { border-bottom: 0; }
.ft .name { font-weight: 600; }
.ft .rep { display: inline-flex; gap: 6px; align-items: center; }
.ft .rep .n { color: var(--foreground); font-weight: 400; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
/* Ship page header */
.ship-h { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 8px; }
.ship-h .n { font-size: 17px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.ship-h .line { margin-top: 6px; display: flex; gap: 10px; align-items: center; font-size: 13px; flex-wrap: wrap; }
/* Sidebar and Needs crew */
.side { width: 210px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px; font-size: 13px; }
.side div { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-radius: 6px; }
.side div.on { background: var(--secondary); }
.side b { min-width: 20px; padding: 0 6px; border-radius: 9999px; text-align: center; font-size: 11px; font-weight: 600; }
.nc { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; font-size: 13px; }
.nc div { display: flex; gap: 14px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--border); }
.nc div:last-child { border-bottom: 0; }
/* Harbour */
.nums { display: grid; gap: 8px; }
.num { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 9px 11px; min-width: 0; }
.num .v { font-size: 24px; font-weight: 700; line-height: 1.05; }
.num .w { display: flex; align-items: flex-start; gap: 4px; font-size: 12px; margin-top: 3px; }
.num .w svg { margin-top: 1px; }
.nums.small .num { padding: 7px 6px; text-align: center; }
.nums.small .num .v { font-size: 19px; }
.nums.small .num .w { font-size: 11px; justify-content: center; }
.nums.small .num .w svg { width: 12px; height: 12px; }
.grp { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; margin: 12px 0 7px; }
.grp span { font-weight: 400; color: var(--muted-foreground); }
.tiles { display: grid; gap: 8px; }
.tile { position: relative; overflow: hidden; border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 9px 11px; min-height: 92px; display: flex; flex-direction: column; }
.tile .h { display: flex; align-items: center; gap: 7px; font-weight: 600; font-size: 13px; }
.tile .k { width: 20px; height: 20px; border: 1px solid var(--border); border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); color: var(--foreground); }
.tile .k svg { width: 12px; height: 12px; }
.tile .note { font-size: 12px; color: var(--muted-foreground); margin-top: 4px; flex: 1; }
.tile .f { display: flex; justify-content: space-between; align-items: center; font-size: 12px; margin-top: 8px; }
.tile .f .t { color: var(--muted-foreground); text-align: right; }
.tile .f .st { white-space: nowrap; }
.tile .band { position: absolute; left: 25%; right: 25%; bottom: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--band), transparent); }
.bar { display: flex; gap: 8px; align-items: center; margin: 10px 0 0; font-size: 12px; }
.bar .ctl { border: 1px solid var(--border); background: var(--card); border-radius: 6px; padding: 5px 9px; display: inline-flex; gap: 5px; align-items: center; }
.menu { margin-top: 6px; width: 190px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 4px; font-size: 13px; box-shadow: 0 6px 18px rgb(0 0 0 / .08); }
.menu div { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 5px; }
.menu .box { width: 14px; height: 14px; border: 1px solid var(--border); border-radius: 4px; }
.flex { display: flex; gap: 14px; align-items: flex-start; }
/* Legend and contrast */
.sw { display: inline-block; width: 46px; height: 22px; border-radius: 5px; border: 1px solid; vertical-align: middle; font-size: 11px; text-align: center; line-height: 20px; font-weight: 600; }
.pass { color: var(--tone-ok-fg); font-weight: 600; }
.fail { color: #d0302a; font-weight: 700; }
</style>
</head>

<svg width="0" height="0" style="position:absolute">

<script>
const ic = (id, extra = '') => id ? `<svg class="i" ${extra}><use href="#${id}"/></svg>` : '';
const fg = (t) => t ? `color:var(--tone-${t}-fg)` : 'color:var(--muted-foreground)';
const fill = (t) => t ? `background:var(--tone-${t}-bg);border-color:var(--tone-${t}-border)` : '';

// Each look: word, icon, tone. Today as built; proposed as Thomas's answers on issue 1618.
const TODAY = {
  awaiting: ['Awaiting crew', 'circle-dashed', 'waiting'], crewed: ['Crewed', 'user-check', 'ok'], retired: ['Retired', 'archive', 'ended'],
  alertBadge: ['Alert', 'triangle-alert', 'attention'],
  working: ['Working', 'activity', 'active'], blocked: ['Blocked', 'octagon-pause', 'waiting'], idle: ['Idle', 'circle-pause', 'ended'],
  hAlert: ['Alert', 'circle-alert', 'attention'], hWaiting: ['Waiting', 'hourglass', 'waiting'], hWorking: ['Working', 'circle-play', 'ok'], hIdle: ['Idle', 'circle-pause', null],
  needsCrew: ['Needs crew', 'clock', 'waiting'],
};
const NEW = {
  alert: ['Alert', 'triangle-alert', 'attention'], awaiting: ['Awaiting crew', 'circle-dashed', 'waiting'], blocked: ['Blocked', 'octagon-pause', 'blocked'],
  working: ['Working', 'activity', 'active'], idle: ['Idle', 'circle-pause', null],
  crewed: ['Crewed', 'user-check', 'ok'], retired: ['Retired', 'archive', 'ended'], needsCrew: ['Needs crew', 'clock', 'waiting'],
};
const st = ([w, i, t]) => `<span class="st" style="${fg(t)}">${ic(i)}${w}</span>`;
const badge = ([w, i, t]) => `<span class="badge" style="${fg(t)};${fill(t)}">${ic(i)}${w}</span>`;

// Console list: the fleet table, the overview's List view (#1605). Status, then the Alert badge; Report with its note.
function fleetTable(L, rows) {
  const tr = rows.map(([name, status, alert, report, note, seen]) => `<tr><td class="name mono">${name}</td>
    <td><span style="display:inline-flex;gap:6px;align-items:center">${st(L[status])}${alert ? badge(L.alertBadge || L.alert) : ''}</span></td>
    <td>${report ? `<span class="rep">${st(L[report])}<span class="n">${note}</span></span>` : '<span class="muted">No report</span>'}</td>
    <td class="muted">${seen}</td></tr>`).join('');
  return `<table class="ft"><tr><th>Name</th><th>Status</th><th>Report</th><th>Last activity</th></tr>${tr}</table>`;
}
const LIST_ROWS = [
  ['ecosystem-relationships', 'crewed', true, 'working', 'Drafting the partner list', '2 h'],
  ['walker-3', 'awaiting', false, null, '', 'No activity yet'],
  ['builder-gateway', 'crewed', false, 'blocked', 'Waiting for release 0.37.0', '25 min'],
  ['orchestrator-1', 'crewed', false, 'working', 'Cutting #189 into slices', 'now'],
  ['aeolus-guide', 'crewed', false, 'idle', 'Nothing open', '28 Oct'],
  ['old-scout', 'retired', false, null, '', '12 Oct'],
];

function shipPage(L) {
  const h = (name, status, alert, report, note) => `<div class="ship-h"><div class="n mono">${name}</div>
    <div class="line">${st(L[status])}${alert ? badge(L.alertBadge || L.alert) : ''}${report ? `<span class="muted">·</span>${st(L[report])}<span>${note}</span>` : ''}</div></div>`;
  return h('builder-gateway', 'crewed', false, 'blocked', 'Waiting for release 0.37.0')
    + h('ecosystem-relationships', 'crewed', true, 'working', 'Drafting the partner list')
    + h('walker-3', 'awaiting', false, null, '')
    + h('aeolus-guide', 'crewed', false, 'idle', 'Nothing open');
}

function needsCrew(L) {
  return `<div class="flex"><div class="side">
    <div><span>Fleet overview</span></div><div><span>Health</span><b style="color:var(--tone-attention-fg);background:var(--tone-attention-bg)">2</b></div>
    <div class="on"><span>Needs crew</span><b style="background:var(--secondary);color:var(--foreground)">2</b></div><div><span>Operator inbox</span></div></div>
    <div class="nc"><div><span class="mono" style="font-weight:600;width:150px">walker-3</span>${st(L.needsCrew)}<span class="muted">Requested 12 min ago</span></div>
    <div><span class="mono" style="font-weight:600;width:150px">review-2</span>${st(L.needsCrew)}<span class="muted">Requested 1 h ago</span></div></div></div>`;
}

// Harbour: numbers and tiles; the console's cards view at 1440 (four tiles a row) and Bridge's column (one a row).
function numbers(nums, small) {
  const cols = nums.length;
  return `<div class="nums ${small ? 'small' : ''}" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${nums.map(([n, look, filled]) => {
    const [w, i, t] = look;
    const color = t ? fg(t) : 'color:var(--foreground)';
    return `<div class="num" style="${filled ? fill(t) : ''}"><div class="v" style="${color}">${n}</div><div class="w" style="${t ? fg(t) : 'color:var(--muted-foreground)'}">${ic(i)}<span>${w}</span></div></div>`;
  }).join('')}</div>`;
}
const KIND = { people: ['People', 'users', 'user'], agents: ['Agents', 'agent', 'agent'], plugins: ['Plugins', 'plug', 'plug'] };
function tile([name, look, note, time, kind]) {
  const [w, i, t] = look;
  return `<div class="tile" style="${fill(t)}"><div class="h"><span class="k">${ic(KIND[kind][2])}</span><span class="mono">${name}</span></div>
    <div class="note">${note}</div><div class="f"><span class="st" style="${t ? fg(t) : 'color:var(--muted-foreground)'};font-size:12px">${ic(i)}${w}</span><span class="t">${time}</span></div>
    ${w === 'Working' ? '<div class="band"></div>' : ''}</div>`;
}
function groups(gs, per) {
  return gs.map(([kind, tiles]) => `<div class="grp">${ic(KIND[kind][1])}${KIND[kind][0]} <span>${tiles.length}</span></div>
    <div class="tiles" style="grid-template-columns:repeat(${per},minmax(0,1fr))">${tiles.map((t) => tile([...t, kind])).join('')}</div>`).join('');
}
const SHIPS = { look: null };
function harbourFixtures(L, today) {
  const A = today ? L.hAlert : L.alert, W = today ? L.hWorking : L.working, I = today ? L.hIdle : L.idle;
  const AW = today ? L.hWaiting : L.awaiting, B = today ? L.hWaiting : L.blocked;
  const nums = today
    ? [[19, ['Ships', 'ship', null]], [1, A, true], [3, L.hWaiting], [8, W], [7, I]]
    : [[19, ['Ships', 'ship', null]], [1, A, true], [2, AW], [1, B], [8, W], [7, I]];
  const gs = [
    ['people', [['thomas', AW, '4 wait on you', '12 min'], ['argo', I, 'Nothing open', '3 h']]],
    ['agents', [['ecosystem-relationships', A, 'No report change for 2 h', '2 h'], ['builder-gateway', B, 'Blocked: waiting for release 0.37.0', '25 min'],
      ['walker-3', AW, 'Awaiting crew', 'No activity yet'], ['orchestrator-1', W, 'Cutting #189 into slices', 'now']]],
    ['plugins', [['squadrons', W, 'design-sq: 3 on station', '1 min'], ['aeolus-guide', I, 'Nothing open', '28 Oct']]],
  ];
  return { nums, gs };
}
function stateFilter(L, today) {
  const opts = today ? [L.hAlert, L.hWaiting, L.hWorking, L.hIdle] : [L.alert, L.awaiting, L.blocked, L.working, L.idle];
  return `<div class="bar"><span class="ctl">${ic('search')}<span class="muted">Search ships by name</span></span><span class="ctl">State <b>All</b>${ic('chevron-down')}</span><span class="ctl">Type <b>All</b>${ic('chevron-down')}</span>
    <span style="flex:1"></span><span class="ctl">${ic('grid')}Cards</span><span class="ctl muted">${ic('list')}List</span></div>
    <div class="menu">${opts.map((o) => `<div><span class="box"></span>${st(o)}</div>`).join('')}</div>`;
}
function harbourCards(L, today) {
  const { nums, gs } = harbourFixtures(L, today);
  return numbers(nums, false) + groups(gs.slice(0, 2), 4);
}
function harbourList(L, today) {
  const { nums } = harbourFixtures(L, today);
  return numbers(nums, false) + stateFilter(L, today) + '<div style="height:10px"></div>' + fleetTable(L, LIST_ROWS.slice(0, 5));
}
function bridge(L, today) {
  const { nums, gs } = harbourFixtures(L, today);
  return `<div style="width:410px"><div class="grp" style="margin-top:0">${ic('ship')}Your fleet</div>${numbers(nums, true)}${groups(gs.slice(1, 2), 1)}</div>`;
}

const PLACES = [
  ['Console ship list', 'The fleet table: Status, the Alert badge after it, Report. Since #1605 also Harbour\'s List view.', (L) => fleetTable(L, LIST_ROWS), (L) => fleetTable(L, LIST_ROWS)],
  ['Ship page', 'The header: StatusBadge, the Alert badge, then the report line.', shipPage, shipPage],
  ['Needs crew', 'The sidebar count and the page\'s rows. Needs crew is a crew request\'s state, not a ship\'s: its word and icon stay.', needsCrew, needsCrew],
  ['Harbour, cards', 'The console overview at 1440: the numbers, then four tiles a row (fleet-overview, #1605).', (L) => harbourCards(L, true), (L) => harbourCards(L, false)],
  ['Harbour, list', 'The same numbers, the filter bar with State open, the fleet table below.', (L) => harbourList(L, true), (L) => harbourList(L, false)],
  ['Bridge, Your fleet', 'aeolus-fleet-gateway: Harbour in Bridge\'s column at 1440, small numbers, one tile a row.', (L) => bridge(L, true), (L) => bridge(L, false)],
];

// The tones: meaning, which ship states take them, and contrast measured below.
const TONES = [
  ['attention', 'Coral', 'Something is wrong: act now', 'Alert'],
  ['waiting', 'Amber', 'Waits on a person', 'Awaiting crew (Needs crew)'],
  ['blocked', 'Violet (new)', 'The crew says it cannot go on', 'Blocked'],
  ['active', 'Sea', 'Live and in motion', 'Working'],
  ['ok', 'Green, as today', 'Settled and well', 'Crewed'],
  ['ended', 'Grey, as today', 'Over for good', 'Retired'],
  [null, 'No tone', 'Nothing going on', 'Idle'],
];
function legend() {
  const sw = (cls, t) => t
    ? `<span class="${cls}"><span class="sw" style="background:var(--tone-${t}-bg);border-color:var(--tone-${t}-border);color:var(--tone-${t}-fg)">Aa</span></span>`
    : `<span class="sw" style="background:var(--card);border-color:var(--border);color:var(--muted-foreground)">Aa</span>`;
  return `<table class="t"><tr><th>Token in @aeolus-fleet/ui</th><th>Colour</th><th>Means</th><th>Ship state</th><th>Today</th><th>Proposed</th></tr>
    ${TONES.map(([t, c, m, s]) => `<tr><td><code>${t ? `--tone-${t}-{fg,bg,border}` : 'muted-foreground on card'}</code></td><td>${c}</td><td>${m}</td><td>${s}</td>
    <td>${t === 'blocked' ? '<span class="muted">none</span>' : sw('today', t)}</td><td>${sw('proposed', t)}</td></tr>`).join('')}</table>`;
}

// Contrast: draw each colour on a canvas and read it back, WCAG 2 relative luminance.
const cv = document.createElement('canvas'); cv.width = cv.height = 1; const cx = cv.getContext('2d', { willReadFrequently: true });
function rgb(css) { cx.clearRect(0, 0, 1, 1); cx.fillStyle = '#000'; cx.fillStyle = css; cx.fillRect(0, 0, 1, 1); return [...cx.getImageData(0, 0, 1, 1).data].slice(0, 3); }
function lum([r, g, b]) { const f = (c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; }; return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b); }
function ratio(a, b) { const [x, y] = [lum(rgb(a)), lum(rgb(b))].sort((p, q) => q - p); return (x + 0.05) / (y + 0.05); }
function contrastTable(root) {
  const probe = root.querySelector('.probe');
  const read = (name) => getComputedStyle(probe).getPropertyValue(name).trim();
  const rows = TONES.map(([t, c]) => {
    const f = t ? read(`--tone-${t}-fg`) : read('--muted-foreground');
    const cells = [t ? read(`--tone-${t}-bg`) : read('--card'), read('--card'), read('--background')].map((bg) => {
      const r = ratio(f, bg);
      return `<td class="${r >= 4.5 ? 'pass' : 'fail'}">${r.toFixed(2)} : 1</td>`;
    });
    return `<tr><td>${c}</td><td><code>${t ? `--tone-${t}-fg` : '--muted-foreground'}</code></td><td><code>${f}</code></td>${cells.join('')}</tr>`;
  }).join('');
  return `<table class="t"><tr><th>Colour</th><th>Text and icon</th><th>Value</th><th>On its fill (tile, badge)</th><th>On a card</th><th>On the page</th></tr>${rows}</table>`;
}

function sheet(mode) {
  return `<h1>Ship state colours, ${mode}: today and proposed (#1618)</h1>
<p class="note">Every place a ship's state shows, today as built beside the proposal, as Thomas answered on issue 1618: five states (Alert, Awaiting crew, Blocked, Working, Idle); the tones re-coloured to the brand's Coral, Amber and Sea, violet for Blocked, Idle with no tone; one icon and one word per state, from one part in @aeolus-fleet/ui. Crewed and Retired are a ship's status, not one of the five; they keep green and grey. The colours live only in @aeolus-fleet/ui: every app takes them from the package. Same fleet as the fleet-overview mockups (#1605), 3 Nov.</p>
<h2>One meaning per colour</h2>${legend()}
<h2>Contrast, proposed, ${mode} (WCAG 2, at least 4.5 : 1, measured in this page)</h2><div class="proposed"><span class="probe"></span><div class="ct"></div></div>
<div class="heads"><span>Place</span><span>Today</span><span>Proposed</span></div>
${PLACES.map(([name, note, today, proposed]) => `<div class="place"><div class="label">${name}<small>${note}</small></div>
  <div class="col today"><div class="tag">Today</div>${today(TODAY)}</div><div class="col proposed"><div class="tag">Proposed</div>${proposed(NEW)}</div></div>`).join('')}`;
}
for (const mode of ['light', 'dark']) {
  const root = document.getElementById(mode);
  root.innerHTML = sheet(mode);
  root.querySelector('.ct').innerHTML = contrastTable(root);
}
</script>
